services:
  funpay-stars:
    build: .
    container_name: funpay-stars-bot
    restart: unless-stopped
    environment:
      DB_PATH: /app/data/autostars.db
      LOG_FILE: /app/data/autostars.log
    volumes:
      # Секреты и настройки хоста пробрасываем в контейнер.
      - ./.env:/app/.env:ro
      # База данных (заказы, статистика, трекер задач) и логи сохраняем
      # в каталог ./data на хосте — переживают пересборку контейнера.
      - ./data:/app/data
    command: ["python", "-m", "autostars.main"]
