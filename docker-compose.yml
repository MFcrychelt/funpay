services:
  autostars:
    build: .
    image: autostars:local
    container_name: autostars
    restart: unless-stopped
    # PID 1 = python: SIGTERM от `docker stop` долетает до цикла,
    # и он корректно дожидается текущих выдач (shutdown_timeout).
    init: true
    env_file:
      - .env
    environment:
      # база и логи — в каталоге, который переживает пересборку контейнера
      AUTOSTARS_HOME: /app/data
      DB_PATH: /app/data/autostars.db
      LOG_FILE: /app/data/autostars.log
    volumes:
      - ./data:/app/data
    stop_grace_period: 60s
    command: []
